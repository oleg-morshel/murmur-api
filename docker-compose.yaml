services:
  murmur-postgres:
    image: postgres:18.6-bookworm
    container_name: murmur-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  murmur-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
    depends_on:
      murmur-postgres:
        condition: service_healthy

  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: murmur-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:murmur-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"
    depends_on:
      murmur-postgres:
        condition: service_healthy
    restart: unless-stopped